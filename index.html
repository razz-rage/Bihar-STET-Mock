<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bihar STET CS Prep Platform</title>
    <link rel="icon" href="logo.png" type="image/png">
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Load React, ReactDOM, and Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; margin: 0; padding: 0; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

       // ==========================================
        // CONFIGURATION: SECURE HASHED
        // ==========================================
        const PASSCODES = {
            
            "8aa0042ef70e2383d0b48c97dbd8f1bd3fbfcb51f18ae415700caaf20a9bd2c5": { role: "admin", name: "Saurabh" },
           
            "3f180e0f52e7eeea6cb76037a04051896177bd490c41afd210f60ab2e750bbe7": { role: "student", name: "USER01" },
           
            "26d334ecdb72db33b7584e601644f87fe323fd4cb787543386f32541059a7a79": { role: "student", name: "USER02" },
            
            "fb1e958b8f309acccee41eba306a6f03c65cfa4c26260fabbe502cf438dbc4b9": { role: "student", name: "USER03" },
          
            "6320f0d3fb723911f7ae6a97075094bbb8360d23b4aac64c8f516a6268814dee": { role: "student", name: "USER04" }
        };

        const UNITS = [
            "Digital Logic", "Computer Organization and Architecture", "Programming and Data Structures",
            "Algorithms", "Operating Systems", "Database Management Systems", "Computer Networks",
            "Software Engineering", "Object Oriented Programming", "Web-Based Application Development",
            "Theory of Computation", "Internet of Things", "Artificial Intelligence",
            "Fundamentals of E-Commerce", "Multimedia"
        ];

        // --- HELPER HOOKS ---

        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        }

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        };

        // ==========================================
        // COMPONENTS
        // ==========================================
const LockScreen = ({ onAccessGranted }) => {
            const [passcode, setPasscode] = useState('');
            const [showError, setShowError] = useState(false);
            const [shareCount, setShareCount] = useState(0); 
            const [isChecking, setIsChecking] = useState(false);

            // Scrambles the typed passcode to check against the secure list
            const hashPasscode = async (text) => {
                const msgBuffer = new TextEncoder().encode(text);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            };

            const handleLogin = async (e) => {
                e.preventDefault();
                setIsChecking(true);
                
                const code = passcode.trim().toUpperCase();
                const hashedCode = await hashPasscode(code);
                
                const user = PASSCODES[hashedCode]; 

                if (user) {
                    setShowError(false);
                    onAccessGranted({ ...user, code });
                } else {
                    setShowError(true);
                    setPasscode('');
                }
                setIsChecking(false);
            };

            const handleShare = async () => {
                const shareData = {
                    title: 'Bihar STET CS Prep Platform',
                    text: 'Practice for Bihar STET Computer Science with full mock tests, PYQs, and instant analytics!',
                    url: 'https://razz-rage.github.io/Bihar-STET-Mock/' // Automatically uses whatever domain you are hosted on
                };
                
                try {
                    if (navigator.share) {
                        await navigator.share(shareData);
                    } else {
                        await navigator.clipboard.writeText(window.location.origin);
                        alert(shareCount === 0 ? 'Link copied! Share it with your first friend.' : 'Link copied! Share it with one more friend.');
                    }
                } catch (err) {
                    console.log('Share canceled or failed:', err);
                } finally {
                    setShareCount(prev => prev + 1);
                }
            };

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl p-8 max-w-md w-full animate-in fade-in">
                        
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                                <i className="fas fa-lock"></i>
                            </div>
                            <h1 className="text-2xl font-black text-slate-800">STET Prep Portal</h1>
                            <p className="text-slate-500 font-medium mt-2">Enter your personal access code</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4 mb-6">
                            <div>
                                <input 
                                    type="password" 
                                    value={passcode}
                                    onChange={(e) => { setPasscode(e.target.value); setShowError(false); }}
                                    placeholder="Enter Passcode..."
                                    className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl text-center font-mono text-xl tracking-widest outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all"
                                />
                            </div>
                            
                            {showError && (
                                <p className="text-rose-500 text-sm font-bold text-center">
                                    Invalid passcode. See below to request access.
                                </p>
                            )}
                            
                            <button type="submit" disabled={isChecking} className="w-full py-4 bg-indigo-600 hover:bg-indigo-700 disabled:opacity-50 text-white font-black rounded-xl transition shadow-md uppercase tracking-wide">
                                {isChecking ? 'Verifying...' : 'Unlock Platform'}
                            </button>
                        </form>

                        <div className="border-t border-slate-100 pt-6 text-center">
                            {shareCount < 2 ? (
                                <button 
                                    onClick={handleShare}
                                    className={`w-full py-3 font-bold rounded-xl transition flex items-center justify-center shadow-sm border ${shareCount === 1 ? 'bg-amber-50 hover:bg-amber-100 text-amber-700 border-amber-200' : 'bg-slate-50 hover:bg-slate-100 text-slate-700 border-slate-200'}`}
                                >
                                    <i className="fas fa-share-alt mr-2 text-indigo-500"></i> 
                                    {shareCount === 0 ? 'Share to Get Passcode' : 'Share to Get Passcode'}
                                </button>
                            ) : (
                                <div className="animate-in fade-in zoom-in duration-300">
                                    <p className="text-sm font-bold text-emerald-600 mb-3">
                                        <i className="fas fa-check-circle mr-1"></i> Access Unlocked!
                                    </p>
                                    <a 
                                        href="https://t.me/Kirat_123" 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="w-full py-3 bg-sky-100 hover:bg-sky-200 text-sky-800 font-bold rounded-xl transition shadow-sm flex items-center justify-center border border-sky-200"
                                    >
                                        <i className="fab fa-telegram-plane mr-2 text-sky-600 text-lg"></i> Message Admin for Passcode
                                    </a>
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        };
        const Sidebar = ({ currentView, setCurrentView, isAdmin, onLogout }) => {
            const allNavItems = [
                { id: 'dashboard', icon: 'fa-home', label: 'Dashboard' },
                { id: 'mock', icon: 'fa-desktop', label: 'Mock Test Engine' },
                { id: 'practice', icon: 'fa-dumbbell', label: 'Random Practice' },
                { id: 'pyq', icon: 'fa-book-open', label: 'PYQ Library' },
                { id: 'analytics', icon: 'fa-chart-pie', label: 'Analytics' },
                { id: 'settings', icon: 'fa-cog', label: 'Settings' }
            ];

            const navItems = allNavItems.filter(item => {
                if (!isAdmin && item.id === 'settings') {
                    return false;
                }
                return true;
            });

            return (
                <div className="w-64 bg-slate-900 text-white min-h-screen flex flex-col shadow-2xl z-10 sticky top-0">
                    <div className="p-6 border-b border-slate-800">
                        <div className="text-2xl font-black tracking-tight text-indigo-400 mb-1">STET<span className="text-white">Prep</span></div>
                        <div className="text-xs text-slate-400 font-medium uppercase tracking-wider">
                            {isAdmin ? 'Admin Mode' : 'Student Mode'}
                        </div>
                    </div>
                    <nav className="flex-1 py-6 px-3 space-y-2 overflow-y-auto">
                        {navItems.map(item => (
                            <button 
                                key={item.id}
                                onClick={() => setCurrentView(item.id)}
                                className={`w-full flex items-center space-x-3 px-4 py-3 rounded-lg transition-all duration-200 ${currentView === item.id ? 'bg-indigo-600 text-white shadow-md' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}`}
                            >
                                <i className={`fas ${item.icon} w-5 text-center`}></i>
                                <span className="font-semibold text-sm">{item.label}</span>
                            </button>
                        ))}
                    </nav>
                    <div className="p-4 border-t border-slate-800 space-y-3">
                        <button onClick={onLogout} className="w-full flex items-center space-x-3 px-4 py-3 text-slate-400 hover:text-rose-400 transition-colors">
                            <i className="fas fa-sign-out-alt w-5 text-center"></i>
                            <span className="font-semibold text-sm">Log Out</span>
                        </button>
                        <div className="bg-slate-800 rounded-lg p-4 text-center">
                            <div className="flex items-center justify-center space-x-2 text-indigo-400 mb-2">
                                <i className="fas fa-database w-5"></i>
                                <span className="text-sm font-bold text-white">Live Fetch Mode</span>
                            </div>
                            <div className="text-xs text-slate-400 mt-1">Data from questions.json</div>
                        </div>
                    </div>
                </div>
            );
        };

        const DashboardView = ({ setCurrentView, db, attempts, userName }) => {
            const bestScore = attempts.length > 0 ? Math.max(...attempts.map(a => a.score)) : 0;
            const avgScore = attempts.length > 0 ? (attempts.reduce((acc, a) => acc + a.score, 0) / attempts.length).toFixed(1) : 0;

            const StatCard = ({ title, value, color }) => (
                <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-1">{title}</div>
                    <div className={`text-3xl font-black text-${color}-600`}>{value}</div>
                </div>
            );

            const ActionCard = ({ icon, color, title, desc, onClick }) => (
                <button onClick={onClick} className={`group bg-white p-8 rounded-xl shadow-sm border border-slate-200 hover:border-${color}-500 hover:shadow-md transition-all text-left flex items-start space-x-6 w-full`}>
                    <div className={`bg-${color}-50 p-4 rounded-full group-hover:bg-${color}-600 group-hover:text-white transition-colors text-${color}-600`}>
                        <i className={`fas ${icon} text-2xl w-8 text-center`}></i>
                    </div>
                    <div>
                        <h3 className="text-xl font-bold text-slate-800">{title}</h3>
                        <p className="text-slate-500 mt-2">{desc}</p>
                    </div>
                </button>
            );

            return (
                <div className="p-8 max-w-6xl mx-auto w-full animate-in fade-in duration-300">
                    <h1 className="text-4xl font-black text-slate-800 mb-2">Welcome Back, {userName}!</h1>
                    <p className="text-slate-500 mb-8 text-lg">Your personalized Bihar STET Computer Science dashboard.</p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
                        <StatCard title="Question Bank" value={db.length} color="slate" />
                        <StatCard title="Mocks Attempted" value={attempts.length} color="blue" />
                        <StatCard title="Best Score" value={`${bestScore} / 75`} color="emerald" />
                        <StatCard title="Avg Score" value={avgScore} color="indigo" />
                    </div>

                    <h2 className="text-2xl font-bold text-slate-800 mb-6">Quick Actions</h2>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <ActionCard icon="fa-clock" color="blue" title="Start Full Mock Test" desc="75 Questions • 75 Minutes. Strictly based on the Bihar STET Computer Science syllabus." onClick={() => setCurrentView('mock')} />
                        <ActionCard icon="fa-dumbbell" color="emerald" title="Random Practice" desc="Quick revision sessions without the timer pressure. Choose length and difficulty." onClick={() => setCurrentView('practice')} />
                        <ActionCard icon="fa-book-open" color="amber" title="PYQ Library" desc="Browse and practice previous year questions from actual STET papers." onClick={() => setCurrentView('pyq')} />
                        <ActionCard icon="fa-chart-pie" color="indigo" title="Performance Analytics" desc="View your test history, score trends, and growth metrics." onClick={() => setCurrentView('analytics')} />    
                    </div>
                </div>
            );
        };

        const MockStartScreen = ({ onStart, onBack }) => {
            return (
                <div className="flex bg-[#f8fafc] min-h-[80vh] font-sans text-slate-900 w-full items-center justify-center p-8">
                    <div className="max-w-3xl w-full bg-white border border-slate-200 rounded-2xl shadow-sm p-8 animate-in fade-in">
                        <div className="border-b border-slate-100 pb-5 mb-6">
                            <span className="inline-block px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2 border border-indigo-100">
                                Bihar STET — Paper II
                            </span>
                            <h1 className="text-3xl font-black text-slate-800">
                                Computer Science Full Subject Mock
                            </h1>
                            <p className="text-slate-500 font-medium mt-2">
                                Classes 11–12 Examination Practice Test
                            </p>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-8">
                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-center">
                                <div className="text-xs text-slate-500 font-bold uppercase tracking-wider">Questions</div>
                                <div className="text-2xl font-black text-slate-800 mt-1">75 MCQs</div>
                            </div>
                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-center">
                                <div className="text-xs text-slate-500 font-bold uppercase tracking-wider">Duration</div>
                                <div className="text-2xl font-black text-slate-800 mt-1">75 Mins</div>
                            </div>
                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-center">
                                <div className="text-xs text-slate-500 font-bold uppercase tracking-wider">Total Marks</div>
                                <div className="text-2xl font-black text-slate-800 mt-1">75</div>
                            </div>
                            <div className="bg-slate-50 p-5 rounded-xl border border-slate-100 text-center">
                                <div className="text-xs text-slate-500 font-bold uppercase tracking-wider">Marking</div>
                                <div className="text-2xl font-black text-emerald-600 mt-1">+1 / 0</div>
                            </div>
                        </div>

                        <div className="bg-blue-50 border border-blue-100 rounded-xl p-6 mb-8 text-slate-700 text-sm leading-relaxed">
                            <h3 className="text-base font-black text-blue-900 mb-3 flex items-center">
                                <i className="fas fa-info-circle mr-2"></i> Instructions to Candidates
                            </h3>
                            <ul className="list-disc pl-5 space-y-2 font-medium">
                                <li>The test comprises exactly <strong>75 questions</strong> mapped to the official Bihar STET syllabus.</li>
                                <li>The countdown timer begins immediately after you click "Start Mock Test".</li>
                                <li>You can navigate freely using the Question Palette.</li>
                                <li>The test will automatically submit when the 75 minutes expire.</li>
                            </ul>
                        </div>

                        <div className="flex items-center justify-between pt-4 border-t border-slate-100">
                            <button onClick={onBack} className="px-6 py-3 text-sm font-bold text-slate-600 hover:text-slate-900 hover:bg-slate-100 rounded-xl transition-colors flex items-center">
                                <i className="fas fa-arrow-left mr-2"></i> Back to Dashboard
                            </button>
                            <button onClick={onStart} className="px-8 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-black text-base rounded-xl shadow-md transition-colors flex items-center">
                                I am ready, Start Mock Test <i className="fas fa-arrow-right ml-2"></i>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const ActiveMock = ({ db, onComplete, onExit }) => {
            const [questions, setQuestions] = useState([]);
            const [currentQ, setCurrentQ] = useState(0);
            const [answers, setAnswers] = useState({});
            const [timeLeft, setTimeLeft] = useState(75 * 60);
            const [isLoaded, setIsLoaded] = useState(false);

            useEffect(() => {
                const easy = db.filter(q => (q.difficulty || '').toUpperCase() === 'EASY').sort(() => 0.5 - Math.random());
                const mod = db.filter(q => (q.difficulty || '').toUpperCase() === 'MODERATE').sort(() => 0.5 - Math.random());
                const hard = db.filter(q => (q.difficulty || '').toUpperCase() === 'HARD').sort(() => 0.5 - Math.random());
                
                let selected = [...easy.slice(0, 23), ...mod.slice(0, 37), ...hard.slice(0, 15)];
                if (selected.length < 75) {
                    const remaining = db.filter(q => !selected.includes(q)).sort(() => 0.5 - Math.random());
                    selected = [...selected, ...remaining.slice(0, 75 - selected.length)];
                }
                
                setQuestions(selected.sort(() => 0.5 - Math.random()));
                setIsLoaded(true);
            }, [db]);

            useEffect(() => {
                if (!isLoaded) return;
                const timer = setInterval(() => {
                    setTimeLeft(prev => {
                        if (prev <= 1) {
                            clearInterval(timer);
                            handleSubmit();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [isLoaded]);

            const handleAnswer = (opt) => setAnswers(prev => ({...prev, [currentQ]: opt}));
            const clearAnswer = () => setAnswers(prev => { const newAns = {...prev}; delete newAns[currentQ]; return newAns; });
            
            const handleSubmit = () => {
                let correct = 0, wrong = 0, unattempted = 0;
                questions.forEach((q, idx) => {
                    if (!answers[idx]) unattempted++;
                    else if (answers[idx] === q.correctAnswer) correct++;
                    else wrong++;
                });
                
                const result = {
                    id: Date.now(), date: new Date().toISOString(),
                    total: questions.length, correct, wrong, unattempted,
                    score: correct, timeUsed: (75 * 60) - timeLeft,
                    questions: questions.map((q, idx) => ({...q, userResponse: answers[idx] || null}))
                };
                onComplete(result);
            };

            if (!isLoaded) return <div className="p-8 text-center mt-20"><i className="fas fa-sync-alt fa-spin text-4xl text-indigo-500 mb-4"></i><p className="font-bold text-slate-600">Generating Mock Test...</p></div>;
            if (!questions.length) return <div className="p-8 text-center text-rose-500 font-bold">Error: Not enough questions in the database.</div>;

            const q = questions[currentQ];
            const warningClass = timeLeft < 300 ? "text-rose-600 animate-pulse" : "text-slate-700";

            return (
                <div className="flex flex-col h-screen bg-slate-50 w-full fixed inset-0 z-50">
                    <div className="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
                        <div className="font-bold text-lg text-slate-800 flex items-center">
                            <i className="fas fa-desktop mr-3 text-indigo-600"></i> STET CS <span className="text-sm font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded ml-2">Paper II</span>
                        </div>
                        <div className={`text-2xl font-black font-mono tracking-widest flex items-center ${warningClass}`}>
                            <i className="fas fa-clock w-6 mr-2"></i>{formatTime(timeLeft)}
                        </div>
                        <button onClick={() => { if(window.confirm('Exit mock test? Progress will be lost.')) onExit(); }} className="text-rose-500 font-bold hover:text-rose-700 flex items-center bg-rose-50 px-4 py-2 rounded-lg">
                            <i className="fas fa-times w-4 mr-1"></i> Exit
                        </button>
                    </div>

                    <div className="flex flex-1 overflow-hidden">
                        <div className="flex-1 p-8 overflow-y-auto">
                            <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-8 max-w-4xl mx-auto">
                                <div className="flex justify-between items-center mb-6 border-b border-slate-100 pb-4">
                                    <h2 className="text-2xl font-black text-slate-800">Question {currentQ + 1} <span className="text-slate-400 text-lg font-medium">of {questions.length}</span></h2>
                                    <div className="flex space-x-2">
                                        <span className="text-xs px-2 py-1 bg-slate-100 text-slate-600 rounded border border-slate-200 font-bold uppercase tracking-wider">{q.difficulty}</span>
                                        {(q.type === 'PYQ' || q.isPYQ) && <span className="text-xs px-2 py-1 bg-amber-100 text-amber-700 rounded border border-amber-200 font-bold uppercase tracking-wider">PYQ</span>}
                                    </div>
                                </div>
                                
                                <p className="text-xl text-slate-800 mb-8 font-medium leading-relaxed">{q.text || q.question}</p>
                                
                                <div className="space-y-4 mb-10">
                                    {['A', 'B', 'C', 'D'].map(opt => (
                                        <label key={opt} className={`flex items-start p-4 border-2 rounded-xl cursor-pointer transition-all ${answers[currentQ] === opt ? 'border-indigo-500 bg-indigo-50 shadow-sm' : 'border-slate-200 hover:border-slate-300 hover:bg-slate-50'}`}>
                                            <input type="radio" name={`q-${currentQ}`} value={opt} checked={answers[currentQ] === opt} onChange={() => handleAnswer(opt)} className="mt-1 w-5 h-5 text-indigo-600" />
                                            <span className="ml-4 font-black text-slate-400 w-6">{opt}.</span>
                                            <span className={`ml-2 flex-1 text-lg ${answers[currentQ] === opt ? 'text-indigo-900 font-semibold' : 'text-slate-700'}`}>{q[`option${opt}`]}</span>
                                        </label>
                                    ))}
                                </div>

                                <div className="flex justify-between items-center pt-6 border-t border-slate-100">
                                    <div className="space-x-3 flex">
                                        <button onClick={clearAnswer} disabled={!answers[currentQ]} className="px-6 py-3 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-lg font-bold disabled:opacity-50 transition-colors">Clear Selection</button>
                                    </div>
                                    <div className="space-x-3 flex">

                        <button onClick={onClose} className="px-6 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg transition-colors flex items-center"><i className="fas fa-home w-4 mr-2"></i> Dashboard</button>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-8">
                        <div className="bg-indigo-600 text-white p-6 rounded-xl shadow-md text-center">
                            <div className="text-indigo-200 text-sm font-bold uppercase tracking-wider mb-1">Total Score</div>
                            <div className="text-5xl font-black">{result.score}</div>
                            <div className="text-indigo-200 font-medium mt-1">out of {result.total}</div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
                            <div className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-1">Accuracy</div>
                            <div className="text-4xl font-black text-emerald-600">{isNaN(accuracy) ? 0 : accuracy}%</div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
                            <div className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-1">Attempted</div>
                            <div className="text-4xl font-black text-blue-600">{attempted}</div>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-slate-200 text-center">
                            <div className="text-slate-500 text-sm font-bold uppercase tracking-wider mb-1">Time Taken</div>
                            <div className="text-4xl font-black text-slate-800">{formatTime(result.timeUsed)}</div>
                        </div>
                    </div>

                    <h2 className="text-2xl font-bold text-slate-800 mb-6">Detailed Analysis</h2>
                    <div className="space-y-6">
                        {result.questions.map((q, idx) => {
                            const isCorrect = q.userResponse === q.correctAnswer;
                            const isUnattempted = !q.userResponse;
                            
                            let borderClass = isUnattempted ? "border-slate-300" : (isCorrect ? "border-emerald-400" : "border-rose-400");
                            let icon = isUnattempted ? <i className="fas fa-exclamation-triangle text-3xl text-slate-400"></i> : (isCorrect ? <i className="fas fa-check-circle text-3xl text-emerald-500"></i> : <i className="fas fa-times-circle text-3xl text-rose-500"></i>);

                            return (
                                <div key={idx} className={`p-6 rounded-xl border-l-8 shadow-sm bg-white ${borderClass}`}>
                                    <div className="flex justify-between items-start mb-4">
                                        <h3 className="text-lg font-bold text-slate-800 flex items-center">
                                            <span className="w-8 h-8 flex items-center justify-center bg-slate-100 rounded-full mr-3 text-sm shrink-0">{idx + 1}</span>
                                            {q.text || q.question}
                                        </h3>
                                        {icon}
                                    </div>
                                    
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 mb-4 ml-11">
                                        {['A', 'B', 'C', 'D'].map(opt => {
                                            const isSelected = q.userResponse === opt;
                                            const isActuallyCorrect = q.correctAnswer === opt;
                                            
                                            let optClass = "border-slate-200 text-slate-700 bg-slate-50";
                                            if (isActuallyCorrect) optClass = "border-emerald-500 bg-emerald-50 text-emerald-900 font-bold shadow-sm";
                                            else if (isSelected) optClass = "border-rose-500 bg-rose-50 text-rose-900 font-bold";

                                            return (
                                                <div key={opt} className={`p-3 border rounded-lg ${optClass}`}>
                                                    <span className="mr-2 font-black opacity-50">{opt}.</span> {q[`option${opt}`]}
                                                </div>
                                            )
                                        })}
                                    </div>

                                    <div className="ml-11 mt-4 bg-blue-50 border border-blue-100 rounded-xl p-5 text-sm text-slate-800 leading-relaxed relative">
                                        <strong className="text-blue-800 mb-2 flex items-center text-base"><i className="fas fa-info-circle w-5 mr-2"></i> Official Explanation:</strong>
                                        <p className="pr-24">{q.explanation}</p>
                                        
                                        <button 
                                            onClick={() => setReportingQ(q)} 
                                            className="absolute top-4 right-4 text-xs font-bold text-slate-500 hover:text-rose-600 transition-colors flex items-center bg-white px-3 py-1.5 rounded-lg border border-slate-200 shadow-sm hover:border-rose-200 hover:bg-rose-50"
                                        >
                                            <i className="fas fa-flag mr-2"></i> Report Error
                                        </button>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };
        const AnalyticsView = ({ attempts }) => {
            const avg = attempts.length ? (attempts.reduce((a, b) => a + b.score, 0) / attempts.length).toFixed(1) : 0;
            return (
                <div className="p-8 max-w-5xl mx-auto w-full animate-in fade-in">
                    <div className="flex items-center mb-6">
                        <i className="fas fa-chart-pie text-3xl text-indigo-600 mr-3"></i>
                        <h2 className="text-3xl font-black text-slate-800">Performance Analytics</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-lg font-bold text-slate-700 mb-6">Overall Growth</h3>
                            <div className="flex items-end space-x-2 h-40 border-b border-slate-200 pb-2">
                                {attempts.slice(-10).map((a, i) => (
                                    <div key={i} className="bg-indigo-500 w-12 rounded-t-sm" style={{ height: `${(a.score/75)*100}%` }}></div>
                                ))}
                                {!attempts.length && <p className="text-slate-400 text-sm mx-auto mb-4">No tests taken yet.</p>}
                            </div>
                        </div>
                        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
                            <h3 className="text-lg font-bold text-slate-700 mb-2">Average Score</h3>
                            <div className="text-6xl font-black text-indigo-600">{avg}</div>
                            <p className="text-slate-500 mt-2">Out of 75 total marks.</p>
                        </div>
                    </div>
                </div>
            );
        };

        const SettingsView = ({ db, onAddQuestions }) => {
            const [importMsg, setImportMsg] = useState("");

            const handleFileUpload = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const importedData = JSON.parse(e.target.result);
                        if (!Array.isArray(importedData)) throw new Error();

                        let validQuestions = [];
                        let skippedCount = 0;

                        importedData.forEach(q => {
                            const qText = q.question || q.text;
                            if (qText && q.optionA && q.optionB && q.optionC && q.optionD && q.correctAnswer && q.explanation) {
                                const isDuplicate = db.some(existing => (existing.text || existing.question || "").trim() === qText.trim());
                                if (!isDuplicate) {
                                    validQuestions.push({
                                        id: q.id || `imp_${Date.now()}_${Math.random().toString(36).substr(2, 9)}`,
                                        type: q.type || 'PYQ',
                                        subject: q.subject || 'CS',
                                        unit: q.unit || 'Miscellaneous',
                                        topic: q.topic || 'Imported Question',
                                        difficulty: q.difficulty ? q.difficulty.toUpperCase() : 'MODERATE',
                                        text: qText,
                                        optionA: q.optionA,
                                        optionB: q.optionB,
                                        optionC: q.optionC,
                                        optionD: q.optionD,
                                        correctAnswer: q.correctAnswer.toUpperCase(),
                                        explanation: q.explanation,
                                        examYear: q.year || q.examYear || null,
                                        shift: q.shift || null,
                                        source: q.source || null
                                    });
                                } else {
                                    skippedCount++;
                                }
                            } else {
                                skippedCount++;
                            }
                        });

                        onAddQuestions(validQuestions);
                        setImportMsg(`Success! Added ${validQuestions.length} questions. Skipped ${skippedCount} duplicates/invalid.`);
                    } catch (err) {
                        setImportMsg("Error parsing JSON file. Please ensure it is a valid JSON array.");
                    }
                    event.target.value = "";
                };
                reader.readAsText(file);
            };

            const downloadBackup = () => {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "stet_db_backup.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            };

            return (
                <div className="p-8 max-w-3xl mx-auto w-full animate-in fade-in">
                    <div className="flex items-center mb-6">
                        <i className="fas fa-cog text-3xl text-slate-600 mr-3"></i>
                        <h2 className="text-3xl font-black text-slate-800">Settings & Data</h2>
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mb-6">
                        <h3 className="text-xl font-bold text-slate-800 mb-2">Manage Question Bank</h3>
                        <p className="text-slate-500 mb-4 text-sm">Upload a JSON file to add questions to your local storage, or export your full question bank.</p>
                        
                        <div className="flex gap-4">
                            <label className="flex-1 flex flex-col items-center justify-center p-4 border-2 border-dashed border-indigo-300 rounded-lg cursor-pointer hover:bg-indigo-50 transition-colors">
                                <i className="fas fa-cloud-upload-alt text-indigo-500 text-2xl mb-2"></i>
                                <span className="font-bold text-indigo-700 text-sm">Import JSON Mini-Batch</span>
                                <input type="file" accept=".json" onChange={handleFileUpload} className="hidden" />
                            </label>

                            <button onClick={downloadBackup} className="flex-1 flex flex-col items-center justify-center p-4 border-2 border-dashed border-emerald-300 rounded-lg cursor-pointer hover:bg-emerald-50 transition-colors">
                                <i className="fas fa-file-download text-emerald-500 text-2xl mb-2"></i>
                                <span className="font-bold text-emerald-700 text-sm">Export JSON Backup</span>
                            </button>
                        </div>
                        
                        {importMsg && (
                            <div className={`mt-4 p-3 rounded-lg text-sm font-bold ${importMsg.includes('Success') ? 'bg-emerald-100 text-emerald-800 border border-emerald-200' : 'bg-rose-100 text-rose-800 border border-rose-200'}`}>
                                {importMsg}
                            </div>
                        )}
                    </div>

                    <div className="bg-white p-8 rounded-2xl shadow-sm border border-rose-200 border-l-4 border-l-rose-500">
                        <h3 className="text-xl font-bold text-rose-800 mb-2">Danger Zone</h3>
                        <p className="text-slate-600 mb-6">Clearing your local storage will delete all your attempts and custom questions permanently.</p>
                        <button onClick={() => { if(window.confirm("Delete all data?")) { window.localStorage.clear(); window.location.reload(); } }} className="px-6 py-3 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-lg flex items-center">
                            <i className="fas fa-trash-alt w-5 mr-2"></i> Factory Reset App
                        </button>
                    </div>
                </div>
            );
        };

        const AuthenticatedApp = ({ currentUser, setCurrentUser }) => {
            const [attempts, setAttempts] = useLocalStorage(`stet_cs_attempts_${currentUser.name.replace(/\s+/g, '_').toLowerCase()}`, []);
            const [customQs, setCustomQs] = useLocalStorage('stet_custom_qs', []);
            
            const [db, setDb] = useState([]);
            const [isLoadingDb, setIsLoadingDb] = useState(true);
            const [dbError, setDbError] = useState(false);

            const [currentView, setCurrentView] = useState('dashboard');
            const [testResult, setTestResult] = useState(null);
            const [isTestStarted, setIsTestStarted] = useState(false);

            const isAdmin = currentUser.role === 'admin';

            useEffect(() => {
                setIsLoadingDb(true);
                fetch('./questions.json')
                    .then(res => { if (!res.ok) throw new Error("File not found"); return res.json(); })
                    .then(data => {
                        const combined = [...customQs, ...data];
                        const unique = Array.from(new Map(combined.map(q => [q.id || q.text || q.question, q])).values());
                        setDb(unique);
                        setIsLoadingDb(false);
                    })
                    .catch(err => {
                        console.error("Error loading questions.json:", err);
                        const combined = [...customQs, ...[]];
                        const unique = Array.from(new Map(combined.map(q => [q.id || q.text || q.question, q])).values());
                        setDb(unique);
                        setDbError(true);
                        setIsLoadingDb(false);
                    });
            }, [customQs]);

            const handleAddQuestions = (newQuestions) => { setCustomQs(prev => [...newQuestions, ...prev]); };

            const handleMockComplete = (result) => {
                setIsTestStarted(false);
                if (result.timeUsed < 300) {
                    alert("Test submitted in under 5 minutes. This attempt is considered invalid and has not been saved.");
                    setTestResult(null);
                    setCurrentView('dashboard');
                    return;
                }
                setAttempts(prev => [...prev, result]);
                setTestResult(result);
            };

            if (isLoadingDb) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center text-white font-bold text-xl">
                        <i className="fas fa-circle-notch fa-spin mr-3"></i> Loading Question Bank...
                    </div>
                );
            }

            if (testResult) {
                return <ResultDashboard result={testResult} onClose={() => { setTestResult(null); setCurrentView('dashboard'); }} />;
            }

            if (currentView === 'mock') {
                if (!isTestStarted) {
                    return <MockStartScreen onStart={() => setIsTestStarted(true)} onBack={() => { setIsTestStarted(false); setCurrentView('dashboard'); }} />;
                }
                return <ActiveMock db={db} onComplete={handleMockComplete} onExit={() => { setIsTestStarted(false); setCurrentView('dashboard'); }} />;
            }

            return (
                <div className="flex bg-[#f8fafc] min-h-screen font-sans text-slate-900">
                    <Sidebar 
                        currentView={currentView} 
                        setCurrentView={setCurrentView} 
                        isAdmin={isAdmin} 
                        onLogout={() => setCurrentUser(null)} 
                    />
                    <div className="flex-1 overflow-y-auto relative">
                        {dbError && (
                            <div className="bg-rose-100 text-rose-800 p-4 font-bold text-sm text-center">
                                <i className="fas fa-exclamation-triangle mr-2"></i> 
                                Could not load 'questions.json'. Ensure you are using Live Server or Netlify.
                            </div>
                        )}
                        {currentView === 'dashboard' && <DashboardView setCurrentView={setCurrentView} db={db} attempts={attempts} userName={currentUser.name} />}
                        {currentView === 'practice' && <RandomPracticeView db={db} />}
                        {currentView === 'pyq' && <PYQView db={db} />}
                        {currentView === 'analytics' && <AnalyticsView attempts={attempts} />}
                        {currentView === 'settings' && isAdmin && <SettingsView db={db} onAddQuestions={handleAddQuestions} />}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [currentUser, setCurrentUser] = useLocalStorage('stet_user', null);

            return (
                <>
                    {/* This banner ONLY shows on mobile screens (md:hidden) */}
                    <div className="md:hidden fixed top-0 left-0 w-full bg-rose-600 text-white p-4 text-center text-sm font-bold shadow-xl z-[9999] flex flex-col items-center justify-center border-b-4 border-rose-800">
                        <i className="fas fa-desktop text-2xl mb-2"></i> 
                        Platform not supported on mobile. <br/> Please open on a PC/Laptop for the best experience.
                    </div>

                    {!currentUser ? 
                        <LockScreen onAccessGranted={(user) => setCurrentUser(user)} /> : 
                        <AuthenticatedApp key={currentUser.name} currentUser={currentUser} setCurrentUser={setCurrentUser} />
                    }
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
